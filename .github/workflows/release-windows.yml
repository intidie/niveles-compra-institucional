name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # necesario para crear el release y adjuntar el zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Instalar dependencias y PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Tests
        shell: pwsh
        run: python -m pytest -q -W default

      - name: Compilar con PyInstaller
        shell: pwsh
        run: python -m PyInstaller build.spec --noconfirm

      - name: Prueba de humo del .exe (/health)
        shell: pwsh
        run: |
          $env:PORT = "18080"
          $env:NIVELES_DATA_DIR = Join-Path $env:RUNNER_TEMP "niveles-humo"
          $p = Start-Process -FilePath "dist\NivelesInstitucionales\NivelesInstitucionales.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/health" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match '"status"\s*:\s*"ok"') { $ok = $true; break }
              } catch { }
            }
            if ($ok) {
              $pagina = Invoke-WebRequest -Uri "http://127.0.0.1:18080/" -UseBasicParsing -TimeoutSec 30
              if ($pagina.StatusCode -ne 200) { $ok = $false }
            }
          } finally {
            Get-Process -Name "NivelesInstitucionales" -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not $ok) { throw "El .exe no respondio en /health" }
          Write-Host "Humo OK"

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path "dist\NivelesInstitucionales" -DestinationPath "NivelesInstitucionales-Windows.zip" -Force

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NivelesInstitucionales-Windows
          path: NivelesInstitucionales-Windows.zip
          if-no-files-found: error

      - name: Publicar en GitHub Releases (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NivelesInstitucionales-Windows.zip
          generate_release_notes: true
